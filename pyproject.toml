[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.15", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "1.0.0"
description = "High-performance vector search engine with AVX2 SIMD acceleration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Sentinel Team"}
]
keywords = ["vector", "database", "similarity", "search", "simd", "avx2"]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
